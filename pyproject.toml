[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-tree-eval"
version = "0.1.0"
description = "Rubric-conditioned hybrid tree compaction and Evidence-First evaluation for long-horizon agent traces."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "httpx>=0.25",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
jev = ["typesafe-sdk>=0.1.0"]
tiktoken = ["tiktoken>=0.7.0"]
embed = ["sentence-transformers>=3.0.0"]
hf = ["datasets>=2.18.0"]
dev = ["pytest>=8.0", "ruff>=0.4.0"]
all = ["typesafe-sdk>=0.1.0", "tiktoken>=0.7.0", "sentence-transformers>=3.0.0", "datasets>=2.18.0"]

[project.scripts]
trace-tree-eval = "trace_tree_eval.cli:app"
tte = "trace_tree_eval.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
